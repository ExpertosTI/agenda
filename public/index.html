<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Mi Agenda RENACE · Alertas Inteligentes</title>
  
  <!-- PWA & Mobile Meta Tags -->
  <link rel="manifest" href="/manifest.json">
  <meta name="theme-color" content="#090d16">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Agenda">
  <link rel="apple-touch-icon" href="/icons/icon-192.svg">
  <link rel="icon" type="image/svg+xml" href="/icons/icon-192.svg">

  <!-- Stylesheet -->
  <link rel="stylesheet" href="/css/app.css">
</head>
<body>

  <!-- Toast Notification Container -->
  <div class="toast-container" id="toast-container"></div>

  <!-- Main Mobile App Wrapper -->
  <div class="app-container">
    
    <!-- Top Header -->
    <header>
      <div class="header-meta">
        <span class="date-badge" id="current-date-badge">Hoy</span>
        <h1>Tu Agenda</h1>
      </div>
      <div class="header-actions">
        <button class="icon-btn" id="btn-settings-open" title="Configurar Alertas">⚙️</button>
      </div>
    </header>

    <!-- Date Switcher Bar -->
    <div class="date-selector-bar">
      <button class="date-pill" id="pill-today">Hoy</button>
      <button class="date-pill" id="pill-tomorrow">Mañana</button>
      <div class="date-picker-trigger" title="Elegir Fecha">
        📅
        <input type="date" id="custom-date-picker">
      </div>
    </div>

    <!-- Daily Progress Tracker Card -->
    <div class="progress-card">
      <div class="progress-header">
        <span><span>⚡</span> Progreso del día</span>
        <span id="progress-text">0/0 completados</span>
      </div>
      <div class="progress-bar">
        <div class="progress-fill" id="progress-bar"></div>
      </div>
    </div>

    <!-- Timeline of Events & Transit Nodes -->
    <div class="timeline" id="timeline-container">
      <!-- Injected dynamically via app.js -->
    </div>

  </div>

  <!-- Floating Bottom Bar -->
  <div class="bottom-bar">
    <div class="status-indicator">
      <span class="status-dot"></span>
      <span>Alertas 10m & 5m Activas</span>
    </div>
    <button class="fab-add-btn" id="fab-add-btn" title="Agregar Compromiso">+</button>
  </div>

  <!-- Modal: Crear / Editar Compromiso -->
  <div class="modal-overlay" id="event-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2 id="event-modal-title">Nuevo Compromiso</h2>
        <button class="close-btn" id="btn-close-event-modal">✕</button>
      </div>

      <form id="event-form">
        <div class="form-group">
          <label class="form-label">Título de la actividad *</label>
          <input type="text" class="form-input" id="event-title" placeholder="Ej: Entrevistar Personal" required>
        </div>

        <div class="form-row">
          <div class="form-group" style="flex:1;">
            <label class="form-label">Fecha *</label>
            <input type="date" class="form-input" id="event-date" required>
          </div>
          <div class="form-group" style="flex:1;">
            <label class="form-label">Hora de inicio *</label>
            <input type="time" class="form-input" id="event-time" required>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Ícono representativo</label>
          <div class="icon-selector" id="icon-selector-row">
            <div class="icon-choice selected" data-icon="📌">📌</div>
            <div class="icon-choice" data-icon="🚴">🚴</div>
            <div class="icon-choice" data-icon="💈">💈</div>
            <div class="icon-choice" data-icon="👥">👥</div>
            <div class="icon-choice" data-icon="🍽️">🍽️</div>
            <div class="icon-choice" data-icon="📍">📍</div>
            <div class="icon-choice" data-icon="🛣️">🛣️</div>
            <div class="icon-choice" data-icon="💼">💼</div>
            <div class="icon-choice" data-icon="📞">📞</div>
            <div class="icon-choice" data-icon="✈️">✈️</div>
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Subtítulo / Categoría</label>
          <input type="text" class="form-input" id="event-tag" placeholder="Ej: Evaluación de candidatos">
        </div>

        <div class="form-group">
          <label class="form-label">Ubicación / Destino</label>
          <input type="text" class="form-input" id="event-location" placeholder="Ej: Altamar Restaurant">
        </div>

        <!-- Transit Node Toggle -->
        <div class="form-group" style="background: rgba(255,255,255,0.02); padding: 12px; border-radius: 12px; border: 1px solid var(--border);">
          <label style="display:flex; align-items:center; gap: 8px; font-size: 0.82rem; font-weight:700; cursor:pointer;">
            <input type="checkbox" id="event-has-transit" style="accent-color: var(--accent); width:16px; height:16px;">
            <span>🚗 Incluir tramo de traslado previo</span>
          </label>
          <div id="transit-fields" style="display:none; margin-top: 10px;">
            <input type="text" class="form-input" id="event-transit-text" placeholder="Ej: Traslado a entrevistas (30 min)">
          </div>
        </div>

        <div class="form-group">
          <label class="form-label">Notas adicionales</label>
          <textarea class="form-textarea" id="event-notes" rows="2" placeholder="Detalles, recordatorios o personas clave..."></textarea>
        </div>

        <div class="form-group" style="display:flex; gap: 16px;">
          <label style="display:flex; align-items:center; gap: 6px; font-size: 0.8rem; cursor:pointer;">
            <input type="checkbox" id="event-notify-email" checked style="accent-color: var(--accent);">
            <span>📧 Alerta Correo</span>
          </label>
          <label style="display:flex; align-items:center; gap: 6px; font-size: 0.8rem; cursor:pointer;">
            <input type="checkbox" id="event-notify-whatsapp" checked style="accent-color: var(--accent);">
            <span>💬 Alerta WhatsApp</span>
          </label>
        </div>

        <button type="submit" class="btn-primary">Guardar Compromiso</button>
        <button type="button" class="btn-danger" id="btn-delete-event" style="display:none;">Eliminar Compromiso</button>
      </form>
    </div>
  </div>

  <!-- Modal: Configuración de Alertas & Notificaciones -->
  <div class="modal-overlay" id="settings-modal">
    <div class="modal-sheet">
      <div class="modal-header">
        <h2>Configuración de Alertas</h2>
        <button class="close-btn" id="btn-close-settings-modal">✕</button>
      </div>

      <form id="settings-form">
        <div class="form-group">
          <label class="form-label">📧 Correo de Recepción de Alertas</label>
          <input type="email" class="form-input" id="cfg-email" placeholder="info@renace.tech" required>
        </div>

        <div class="form-group">
          <label class="form-label">💬 Teléfono WhatsApp de Recepción</label>
          <input type="tel" class="form-input" id="cfg-phone" placeholder="18093487921" required>
          <small style="color:var(--text-muted); font-size:11px;">Formato internacional sin + (Ej: 18093487921)</small>
        </div>

        <div class="form-group">
          <label class="form-label">🤖 Instancia Evolution API</label>
          <input type="text" class="form-input" id="cfg-evo-instance" placeholder="RENACE.TECH">
        </div>

        <div class="form-group">
          <label class="form-label">🌐 URL Evolution API</label>
          <input type="text" class="form-input" id="cfg-evo-url" placeholder="https://evoapi.renace.tech">
        </div>

        <button type="submit" class="btn-primary" style="margin-bottom:12px;">Guardar Cambios</button>
      </form>

      <!-- Test Buttons -->
      <div style="border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px;">
        <label class="form-label">Prueba Inmediata de Canales</label>
        <div class="form-row">
          <button type="button" class="btn-secondary" id="btn-test-email" style="flex:1;">📧 Probar Correo SMTP</button>
          <button type="button" class="btn-secondary" id="btn-test-whatsapp" style="flex:1;">💬 Probar WhatsApp</button>
        </div>
      </div>

      <!-- Logs Section -->
      <div style="border-top: 1px solid var(--border); padding-top: 16px; margin-top: 16px;">
        <div style="display:flex; justify-content:space-between; align-items:center;">
          <label class="form-label" style="margin:0;">Historial de Envíos</label>
          <button type="button" id="btn-refresh-logs" style="background:none; border:none; color:var(--accent-light); font-size:11px; cursor:pointer; font-weight:700;">Refrescar</button>
        </div>
        <div class="logs-list" id="logs-container">
          <!-- Logs injected here -->
        </div>
      </div>

    </div>
  </div>

  <!-- Scripts -->
  <script src="/js/api.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
