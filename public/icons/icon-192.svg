<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bgGrad" cx="30%" cy="20%" r="90%">
      <stop offset="0%" stop-color="#4338ca"/>
      <stop offset="60%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#090d16"/>
    </radialGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#818cf8"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="16" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="512" height="512" rx="128" fill="url(#bgGrad)" />
  <rect x="24" y="24" width="464" height="464" rx="104" fill="none" stroke="rgba(255,255,255,0.1)" stroke-width="3" />
  <!-- Calendar Base -->
  <rect x="110" y="140" width="292" height="260" rx="36" fill="rgba(255,255,255,0.06)" stroke="url(#accentGrad)" stroke-width="12" />
  <!-- Calendar Header -->
  <path d="M 110 210 L 402 210" stroke="url(#accentGrad)" stroke-width="12" stroke-linecap="round" />
  <circle cx="180" cy="120" r="16" fill="#818cf8" />
  <circle cx="332" cy="120" r="16" fill="#818cf8" />
  <!-- Lightning Bolt (RENACE power) -->
  <polygon points="275,230 220,310 260,310 235,380 305,290 265,290" fill="url(#accentGrad)" filter="url(#glow)" />
</svg>
